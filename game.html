<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K線練習遊戲</title><script src="lwc.js"></script>
<style>
body{margin:0;background:#0f1419;color:#e6e6e6;font:16px -apple-system,"PingFang TC",sans-serif;padding:10px 10px 40px}
h1{font-size:20px;margin:4px 0}a{color:#6cb6ff}.sb{display:flex;gap:6px;font-size:13px;margin:6px 0}.sb div{flex:1;background:#1b222b;border-radius:8px;padding:6px;text-align:center}.sb b{display:block;font-size:18px}
#ch{height:300px}#vol{height:70px}.lg{font-size:12px;color:#aaa;margin:4px 0}
.row{display:flex;gap:8px;margin:8px 0}button{flex:1;min-height:52px;font-size:18px;border:0;border-radius:10px;color:#fff;background:#333}
.L{background:#d9363e}.S{background:#1f9d55}.W{background:#666}button.on{outline:3px solid #ffd33d}button:disabled{opacity:.4}
label{flex:1;font-size:13px;color:#aaa}input{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border-radius:8px;border:1px solid #444;background:#1b222b;color:#fff}
.go{background:#2f6fde}.nx{background:#8a5cf6}.box{background:#1b222b;border-radius:10px;padding:10px;margin:8px 0;line-height:1.6}.warn{color:#ffb74d}.good{color:#7ee787}.bad{color:#ff7b72}
</style></head><body>
<a href="./">← 回選股網站</a><h1>🎯 K線練習：抓進場點</h1>
<div class="sb"><div>題數<b id="sN">0</b></div><div>勝率<b id="sW">-</b></div><div>連勝<b id="sK">0</b></div><div>累積%<b id="sP">0</b></div><div>追高次數<b id="sC">0</b></div></div>
<div id="q" class="lg">載入中…</div><div id="ch"></div><div id="vol"></div>
<div class="lg"><span style="color:#ffd33d">MA5</span> <span style="color:#ff6bcb">MA10</span> <span style="color:#4fc3f7">MA20</span>｜紅漲綠跌｜虛線＝停損/目標</div>
<div id="ctl"><div class="row"><button class="L" data-s="1">做多</button><button class="S" data-s="-1">做空</button><button class="W" data-s="0">觀望</button></div>
<div class="row"><label>停損價<input id="stp" type="number" inputmode="decimal" step="0.01"></label><label>目標價<input id="tgt" type="number" inputmode="decimal" step="0.01"></label></div>
<div class="lg" id="hint">進場價＝最後一根收盤。預設停損放波段低/高點、目標 ±3%，可自行修改。</div>
<div class="row"><button class="go" id="go" disabled>確認，看後面走勢 ▶</button></div></div>
<div id="res"></div><div class="row"><button class="nx" id="nx" style="display:none">下一題 ➜</button></div>
<script>
const SHOW=60,FUT=15,COST=0.585;let pool=[],cur,side=null,chart,cs,vs,m5,m10,m20,lines=[];
const st=JSON.parse(localStorage.kgame||'{"n":0,"w":0,"k":0,"p":0,"c":0,"t":0}');
function sv(){localStorage.kgame=JSON.stringify(st);sN.textContent=st.n;sW.textContent=st.t?Math.round(st.w/st.t*100)+'%':'-';sK.textContent=st.k;sP.textContent=st.p.toFixed(1);sC.textContent=st.c}
const ma=(a,n,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,x)=>s+x[4],0)/n;
const td=d=>({year:+d.slice(0,4),month:+d.slice(4,6),day:+d.slice(6)});
function init(){chart=LightweightCharts.createChart(ch,{layout:{background:{color:'#0f1419'},textColor:'#ccc'},grid:{vertLines:{color:'#1b222b'},horzLines:{color:'#1b222b'}},timeScale:{visible:false},handleScroll:false,handleScale:false});
cs=chart.addCandlestickSeries({upColor:'#d9363e',downColor:'#1f9d55',borderVisible:false,wickUpColor:'#d9363e',wickDownColor:'#1f9d55'});
m5=chart.addLineSeries({color:'#ffd33d',lineWidth:1,priceLineVisible:false,lastValueVisible:false});m10=chart.addLineSeries({color:'#ff6bcb',lineWidth:1,priceLineVisible:false,lastValueVisible:false});m20=chart.addLineSeries({color:'#4fc3f7',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const vc=LightweightCharts.createChart(vol,{layout:{background:{color:'#0f1419'},textColor:'#ccc'},grid:{vertLines:{visible:false},horzLines:{visible:false}},timeScale:{visible:false},handleScroll:false,handleScale:false});
vs=vc.addHistogramSeries({priceFormat:{type:'volume'}});window.vc=vc}
function draw(n){const k=cur.k.slice(cur.s,cur.s+n),all=cur.k,t=(x,i)=>({time:td(x[0])});
cs.setData(k.map(x=>({time:td(x[0]),open:x[1],high:x[2],low:x[3],close:x[4]})));
for(const[s,p]of[[m5,5],[m10,10],[m20,20]])s.setData(k.map((x,j)=>({time:td(x[0]),value:ma(all,p,cur.s+j)})).filter(o=>o.value));
vs.setData(k.map(x=>({time:td(x[0]),value:x[5],color:x[4]>=x[1]?'#d9363e88':'#1f9d5588'})));chart.timeScale().fitContent();vc.timeScale().fitContent()}
function setLines(){lines.forEach(l=>cs.removePriceLine(l));lines=[];if(!side)return;
lines.push(cs.createPriceLine({price:+stp.value,color:'#ff7b72',lineStyle:2,title:'停損'}),cs.createPriceLine({price:+tgt.value,color:'#7ee787',lineStyle:2,title:'目標'}))}
async function next(){res.innerHTML='';nx.style.display='none';ctl.style.display='';side=null;document.querySelectorAll('[data-s]').forEach(b=>b.classList.remove('on'));go.disabled=true;
for(let tries=0;tries<10;tries++){const r=pool[Math.random()*pool.length|0];try{const h=await (await fetch('hist/'+r.c+'.json')).json();if(h.k.length>=SHOW+FUT+20){const s=20+(Math.random()*(h.k.length-SHOW-FUT-20+1)|0);cur={r,k:h.k,s};break}}catch(e){}}
draw(SHOW);setLines();q.textContent='第 '+(st.n+1)+' 題：這是某檔上市櫃個股的日K（名稱、日期隱藏）。你會怎麼做？'}
function lastI(){return cur.s+SHOW-1}
function pick(s){side=s;document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));const k=cur.k,i=lastI(),c=k[i][4],w=k.slice(i-9,i+1);
if(s===1){stp.value=Math.min(...w.map(x=>x[3])).toFixed(2);tgt.value=(c*1.03).toFixed(2)}else if(s===-1){stp.value=Math.max(...w.map(x=>x[2])).toFixed(2);tgt.value=(c*0.97).toFixed(2)}else{stp.value=tgt.value=''}
stp.disabled=tgt.disabled=!s;go.disabled=false;setLines()}
function judge(){const k=cur.k,i=lastI(),e=k[i][4],S=+stp.value,T=+tgt.value,m5v=ma(k,5,i),m20v=ma(k,20,i);
const v5=k.slice(i-4,i+1).reduce((a,x)=>a+x[5],0)/5,v20=k.slice(i-19,i+1).reduce((a,x)=>a+x[5],0)/20,ph=Math.max(...k.slice(i-20,i).map(x=>x[2])),pl=Math.min(...k.slice(i-20,i).map(x=>x[3]));
const tips=[];let chase=false;const bias=(e/m5v-1)*100;
if(side===1){if(bias>4){chase=true;tips.push(`<span class="warn">⚠️ 追高：收盤高於 MA5 ${bias.toFixed(1)}%（>4%）。朱家泓：離均線太遠不追，等回測 MA5 不破再買。</span>`)}
 if(k[i][4]>ph&&k[i][5]>v20*1.5)tips.push('<span class="good">✅ 帶量突破前20日高點，是標準的多方進場型態。</span>');
 if(e<m20v)tips.push('<span class="warn">股價在 MA20（月線）下方做多＝逆勢，勝率較低。</span>');
 const r=(e-S)/e*100;if(r>5)tips.push(`<span class="warn">停損距離 ${r.toFixed(1)}% > 5%，超出你的規則，這筆不該做或要等更好的點位。</span>`)}
if(side===-1){if(bias<-4){chase=true;tips.push(`<span class="warn">⚠️ 追空：收盤低於 MA5 ${(-bias).toFixed(1)}%，殺低容易被反彈軋。</span>`)}
 if(e>m20v)tips.push('<span class="warn">股價在月線上方做空＝逆勢。</span>');const r=(S-e)/e*100;if(r>5)tips.push(`<span class="warn">停損距離 ${r.toFixed(1)}% > 5%。</span>`)}
if(side===0){tips.push(e>m20v&&m5v>m20v?'這張圖在月線上、均線偏多，觀望保守但可能錯過機會。':'均線沒有明確方向時觀望是好選擇，不做也是一種操作。')}
tips.push(`量能：近5日均量 ${Math.round(v5)} 張 vs 20日均量 ${Math.round(v20)} 張${v5>v20*1.3?'（放量）':v5<v20*0.7?'（量縮）':''}。`);
return{e,S,T,tips,chase}}
function run(){ctl.style.display='none';const J=judge(),k=cur.k,i0=lastI();let n=0,out=null,xp=null;
const tm=setInterval(()=>{n++;const b=k[i0+n];draw(SHOW+n);setLines();
 if(side){if(side===1){if(b[1]<=J.S){out='停損（跳空）';xp=b[1]}else if(b[3]<=J.S){out='停損';xp=J.S}else if(b[1]>=J.T){out='達標（跳空）';xp=b[1]}else if(b[2]>=J.T){out='達標';xp=J.T}}
  else{if(b[1]>=J.S){out='停損（跳空）';xp=b[1]}else if(b[2]>=J.S){out='停損';xp=J.S}else if(b[1]<=J.T){out='達標（跳空）';xp=b[1]}else if(b[3]<=J.T){out='達標';xp=J.T}}}
 if(out||n>=FUT){clearInterval(tm);if(!out){out=side?'時間出場（15日）':'觀望';xp=b[4]}while(n<FUT){n++}draw(SHOW+FUT);setLines();show(J,out,xp,n)}},250)}
function show(J,out,xp,n){const k=cur.k,i0=lastI(),fin=k[i0+FUT][4],mv=(fin/J.e-1)*100;let pl=0,h='';
if(side){pl=side*(xp/J.e-1)*100-COST;st.t++;if(pl>0){st.w++;st.k++}else st.k=0;st.p+=pl}if(J.chase)st.c++;st.n++;sv();
h+=`<div class="box"><b>${cur.r.c} ${cur.r.n}</b>（${cur.r.ind||''}）<br>題目日期：${k[i0][0].replace(/(\d{4})(\d\d)(\d\d)/,'$1/$2/$3')}，進場價 ${J.e}<br>`;
h+=side?`結果：<b>${out}</b> @ ${(+xp).toFixed(2)}<br>損益（含來回成本 ${COST}%）：<b class="${pl>0?'good':'bad'}">${pl.toFixed(2)}%</b>`:`你選擇觀望。後 ${FUT} 天實際漲跌 <b class="${mv>0?'good':'bad'}">${mv.toFixed(2)}%</b>`;
h+=`<br><span class="lg">後${FUT}日走勢：${mv.toFixed(2)}%（真實歷史資料）</span></div><div class="box"><b>📘 老師講評</b><br>${J.tips.join('<br>')}</div>`;
res.innerHTML=h;nx.style.display=''}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>pick(+b.dataset.s));stp.oninput=tgt.oninput=setLines;go.onclick=run;nx.onclick=next;
(async()=>{init();sv();const d=await (await fetch('data.json')).json();pool=d.rows.filter(r=>!r.c.startsWith('00')&&!r.x&&r.v>=2000&&/^\d{4}$/.test(r.c));await next();if(location.hash=="#demo"){pick(1);run()}})();
</script></body></html>
